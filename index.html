<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tamil Nadu Police - Demo Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        linear-gradient(rgba(5, 25, 50, 0.88), rgba(5, 25, 50, 0.95)),
        radial-gradient(circle at top, #1d5a85, #061a30);
    }

    .card {
      width: 400px;
      max-width: 92%;
      background: #fff;
      border-radius: 18px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .demo-badge {
      display: inline-block;
      background: #c62828;
      color: white;
      font-size: 12px;
      font-weight: bold;
      padding: 7px 15px;
      border-radius: 20px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .logo {
      width: 125px;
      height: 125px;
      object-fit: contain;
      margin: 0 auto 15px;
      display: block;
    }

    h1 {
      color: #123c60;
      font-size: 25px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .input-box {
      text-align: left;
      margin-bottom: 18px;
    }

    .input-box label {
      display: block;
      font-weight: bold;
      color: #333;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .input-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .input-box input:focus {
      border-color: #123c60;
      box-shadow: 0 0 0 3px rgba(18, 60, 96, 0.12);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #123c60;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:hover {
      background: #0b2943;
    }

    .notice {
      margin-top: 22px;
      padding: 12px;
      border-radius: 7px;
      background: #fff3cd;
      color: #856404;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 18px;
      color: #999;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="demo-badge">
      DEMO — NOT AN OFFICIAL WEBSITE
    </div>

    <!-- Your uploaded logo -->
    <img src="l.png" alt="Tamil Nadu Police themed demo logo" class="logo">

    <h1>Tamil Nadu Police</h1>

    <p class="subtitle">
      Training Portal — Demonstration
    </p>

    <form id="loginForm">

      <div class="input-box">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          placeholder="Enter username"
          autocomplete="off"
          required>
      </div>

      <div class="input-box">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter password"
          autocomplete="off"
          required>
      </div>

      <button type="submit" class="login-btn">
        LOGIN
      </button>

    </form>

    <div class="notice">
      This is a fictional demonstration page.
      Please do not enter real credentials.
      No username or password is transmitted or stored.
    </div>

    <div class="footer">
      Educational / UI Demonstration
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      alert(
        "Demo Login\n\n" +
        "This demonstration does not authenticate users " +
        "or collect credentials."
      );
    });
  </script>

</body>
</html>
